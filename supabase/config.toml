project_id = "myworkout"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:8081"
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Votre code MyWorkout"
content_path = "./supabase/templates/code.html"

[auth.email.template.magic_link]
subject = "Votre code MyWorkout"
content_path = "./supabase/templates/code.html"

[functions.delete-account]
verify_jwt = true
